name: Keep Veritas Online

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Access Veritas Nexum
        run: |
          echo "Testing Veritas Nexum..."

          curl -L \
            --max-time 60 \
            -A "Mozilla/5.0" \
            -o /dev/null \
            -sS \
            -w "HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n" \
            "${{ secrets.VERITAS_URL }}"

          echo "Veritas Nexum test completed."
