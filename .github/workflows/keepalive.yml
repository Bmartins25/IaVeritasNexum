name: Keep Veritas Online

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Access Veritas Nexum
        run: |
          curl --silent --show-error \
               --max-time 60 \
               -A "Mozilla/5.0" \
               "${{ secrets.VERITAS_URL }}" \
               -o /dev/null

          echo "Veritas Nexum accessed successfully."
